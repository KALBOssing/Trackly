# ADVANCED / OPTIONAL — not required by the setup guide.
#
# Runs BOTH the database and the app itself in Docker, for fully self-hosted deployment
# (e.g. on your own server) instead of using Vercel. Most people following the guide
# should use `docker-compose.yml` (database only) plus `npm run dev` instead.
#
# Before using this:
#   1. Create a real .env file (see .env.example) with a real NEXTAUTH_SECRET.
#   2. Build and start:      docker compose -f docker-compose.full.yml up -d --build
#   3. Run migrations once:  docker compose -f docker-compose.full.yml exec app npx prisma migrate deploy
#   (Migrations aren't baked into the image build because the database isn't reachable
#   yet at build time — they have to run after the containers are up.)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trackly}
    ports:
      - "5432:5432"
    volumes:
      - trackly_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-trackly}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Trackly <no-reply@trackly.app>}
    command: sh -c "node server.js"

volumes:
  trackly_db_data:
