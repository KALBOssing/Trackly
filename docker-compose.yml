# This file starts ONLY the PostgreSQL database — this is what the setup guide uses.
# The app itself runs locally via `npm run dev` (Step 10 of the guide), not in Docker.
#
# If you want to run the *entire app* in Docker too (advanced, optional, not required
# by the guide), see docker-compose.full.yml instead.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trackly}
    ports:
      - "5432:5432"
    volumes:
      - trackly_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trackly_db_data:
